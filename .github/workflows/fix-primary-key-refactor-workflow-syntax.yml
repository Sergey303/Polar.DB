name: Fix primary key refactor workflow syntax

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'validation/set-primary-key-main-ci'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: validation/set-primary-key-main-ci
          fetch-depth: 0
      - name: Replace literal newline escapes in guard tuple
        shell: python
        run: |
          from pathlib import Path

          path = Path('.github/workflows/apply-primary-key-accessor-refactor-v2.yml')
          text = path.read_text(encoding='utf-8')
          old = "          forbidden_usequence = (\\n              'internal Func<object, IComparable> keyFunc;',\\n              'private Func<IComparable, int> hashOfKey;',\\n              'primaryKeyDefinition',\\n              'primaryKeyConfigured',\\n              'keyFunc(element)',\\n              'hashOfKey(key)')"
          new = """          forbidden_usequence = (
              'internal Func<object, IComparable> keyFunc;',
              'private Func<IComparable, int> hashOfKey;',
              'primaryKeyDefinition',
              'primaryKeyConfigured',
              'keyFunc(element)',
              'hashOfKey(key)')"""
          if text.count(old) != 1:
              raise RuntimeError(f'Expected one malformed guard tuple, found {text.count(old)}.')
          path.write_text(text.replace(old, new), encoding='utf-8')
      - name: Commit workflow syntax fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/apply-primary-key-accessor-refactor-v2.yml
          git commit -m 'Fix primary key refactor workflow guard syntax'
          git push origin HEAD:validation/set-primary-key-main-ci
