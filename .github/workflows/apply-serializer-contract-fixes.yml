name: Apply serializer contract fixes

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'validation/set-primary-key-main-ci'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch serializers
        shell: python
        run: |
          from pathlib import Path

          def replace(text, old, new, count=1):
              actual = text.count(old)
              if actual != count:
                  raise RuntimeError(f'Expected {count} occurrences, found {actual}: {old[:80]!r}')
              return text.replace(old, new, count)

          binary = Path('src/Polar.DB/BinarySerialize.cs')
          text = binary.read_text(encoding='utf-8-sig')
          text = replace(text, '                case PTypeEnumeration.real: { bw.Write((double)v); return; }\n                case PTypeEnumeration.sstring:', '''                case PTypeEnumeration.real: { bw.Write((double)v); return; }\n                case PTypeEnumeration.fstring:\n                    {\n                        var type = (PTypeFString)tp;\n                        string value = (string)v;\n                        if (value.Length > type.Length) throw new ArgumentException("Fixed string value exceeds declared length.", nameof(v));\n                        for (int i = 0; i < type.Length; i++) bw.Write((ushort)(i < value.Length ? value[i] : '\\0'));\n                        return;\n                    }\n                case PTypeEnumeration.sstring:''')
          text = replace(text, '                case PTypeEnumeration.real: { return br.ReadDouble(); }\n                case PTypeEnumeration.sstring:', '''                case PTypeEnumeration.real: { return br.ReadDouble(); }\n                case PTypeEnumeration.fstring:\n                    {\n                        var type = (PTypeFString)tp;\n                        var chars = new char[type.Length];\n                        for (int i = 0; i < chars.Length; i++) chars[i] = (char)br.ReadUInt16();\n                        return new string(chars).TrimEnd('\\0');\n                    }\n                case PTypeEnumeration.sstring:''')
          text = replace(text, '            }\n        }\n        public static object Deserialize', '                default: throw new NotSupportedException($"Binary serialization does not support type {tp.Vid}.");\n            }\n        }\n        public static object Deserialize')
          binary.write_text(text, encoding='utf-8-sig')

          path = Path('src/Polar.DB/TextSerialize.cs')
          text = path.read_text(encoding='utf-8-sig')
          marker = '                case PTypeEnumeration.real: { tw.Write(((double)v).ToString("G", System.Globalization.CultureInfo.InvariantCulture)); return; }\n                case PTypeEnumeration.sstring:'
          fixed = '''                case PTypeEnumeration.real: { tw.Write(((double)v).ToString("G", System.Globalization.CultureInfo.InvariantCulture)); return; }\n                case PTypeEnumeration.fstring:\n                    {\n                        var type = (PTypeFString)tp;\n                        string value = (string)v;\n                        if (value.Length > type.Length) throw new ArgumentException("Fixed string value exceeds declared length.", nameof(v));\n                        tw.Write('\\"');\n                        tw.Write(value.Replace("\\\\", "\\\\\\\\").Replace("\\\"", "\\\\\\\""));\n                        tw.Write('\\"');\n                        return;\n                    }\n                case PTypeEnumeration.sstring:'''
          text = replace(text, marker, fixed, 2)
          text = replace(text, "        public bool ReadBoolean()\n        {\n            int c = tr.Read();\n            return c == 't' ? true : false;\n        }", '''        public bool ReadBoolean()\n        {\n            int c = tr.Read();\n            return c switch\n            {\n                't' => true,\n                'f' => false,\n                -1 => throw new EndOfStreamException("Unexpected end of boolean value."),\n                _ => throw new InvalidDataException($"Invalid boolean token '{(char)c}'.")\n            };\n        }''')
          text = replace(text, "        public byte ReadByte()\n        {\n            string s = ReadWhile(c => { if (char.IsDigit(c)) return true; char cc = char.ToLower(c); return cc >= 'a' && cc <= 'f'; });\n            return byte.Parse(s);\n        }", '''        public byte ReadByte()\n        {\n            string s = ReadWhile(char.IsDigit);\n            if (s.Length == 0) throw new InvalidDataException("Byte value must contain decimal digits.");\n            return byte.Parse(s, System.Globalization.CultureInfo.InvariantCulture);\n        }''')
          start = text.index('        public string ReadString()')
          end = text.index('        private object Des(PType tp)', start)
          read_string = '''        public string ReadString()\n        {\n            if (tr.Read() != '\"') throw new InvalidDataException("String value must start with a quote.");\n            StringBuilder sb = new StringBuilder();\n            while (true)\n            {\n                int c = tr.Read();\n                if (c == -1) throw new EndOfStreamException("String value is missing a closing quote.");\n                if (c == '\"') return sb.ToString();\n                if (c == '\\\\')\n                {\n                    c = tr.Read();\n                    if (c == -1) throw new EndOfStreamException("String escape sequence is incomplete.");\n                    if (c == 'n') sb.Append('\\n');\n                    else if (c == 'r') sb.Append('\\r');\n                    else if (c == 't') sb.Append('\\t');\n                    else sb.Append((char)c);\n                }\n                else sb.Append((char)c);\n            }\n        }\n\n'''
          text = text[:start] + read_string + text[end:]
          text = replace(text, '                case PTypeEnumeration.real: { return ReadDouble(); }\n                case PTypeEnumeration.sstring: { return ReadString(); }', '''                case PTypeEnumeration.real: { return ReadDouble(); }\n                case PTypeEnumeration.fstring:\n                    {\n                        string value = ReadString();\n                        var type = (PTypeFString)tp;\n                        if (value.Length > type.Length) throw new InvalidDataException("Fixed string value exceeds declared length.");\n                        return value;\n                    }\n                case PTypeEnumeration.sstring: { return ReadString(); }''')
          text = replace(text, '                    }\n            }\n        }\n        private static int intend = 4;', '                    }\n                default: throw new NotSupportedException($"Text serialization does not support type {tp.Vid}.");\n            }\n        }\n        private static int intend = 4;')
          text = replace(text, '                    }\n            }\n        }\n        public static void SerializeFlowToSequense', '                    }\n                default: throw new NotSupportedException($"Formatted text serialization does not support type {tp.Vid}.");\n            }\n        }\n        public static void SerializeFlowToSequense')
          path.write_text(text, encoding='utf-8-sig')
      - name: Commit serializer fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/Polar.DB/BinarySerialize.cs src/Polar.DB/TextSerialize.cs
          git commit -m 'Fix fixed-string and text serializer contracts'
          git push origin HEAD:main
