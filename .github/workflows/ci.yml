name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
      - 'release/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x

      - name: Locate solution
        id: locate_solution
        shell: pwsh
        run: |
          $solution = Get-ChildItem -Path $env:GITHUB_WORKSPACE -File -Recurse |
            Where-Object { $_.Extension -in '.sln', '.slnx' } |
            Sort-Object FullName |
            Select-Object -First 1 -ExpandProperty FullName

          if (-not $solution) {
            throw 'No .sln or .slnx file was found in the repository.'
          }

          "solution=$solution" >> $env:GITHUB_OUTPUT
          Write-Host "Using solution: $solution"

      - name: Restore
        run: dotnet restore "${{ steps.locate_solution.outputs.solution }}"

      - name: Build complete solution
        run: >-
          dotnet build "${{ steps.locate_solution.outputs.solution }}"
          --configuration Release
          --no-restore
          /p:ContinuousIntegrationBuild=true

      - name: Build typed API with warnings as errors
        run: >-
          dotnet build src/Polar.DB.Typed/Polar.DB.Typed.csproj
          --configuration Release
          --no-restore
          --no-dependencies
          --no-incremental
          /p:ContinuousIntegrationBuild=true
          /warnaserror

      - name: Build shared benchmark library with warnings as errors
        run: >-
          dotnet build benchmarks/src/BenchSupport/BenchSupport.csproj
          --configuration Release
          --no-restore
          --no-incremental
          /p:ContinuousIntegrationBuild=true
          /p:BuildProjectReferences=false
          /warnaserror

      - name: Build isolated benchmark executable with warnings as errors
        run: >-
          dotnet build benchmarks/src/PkIntLookup/PkIntLookup.csproj
          --configuration Release
          --no-restore
          --no-incremental
          /p:ContinuousIntegrationBuild=true
          /p:BuildProjectReferences=false
          /warnaserror

      - name: Smoke-test isolated benchmark workers and raw protocol
        shell: pwsh
        run: |
          dotnet run --project benchmarks/src/PkIntLookup/PkIntLookup.csproj --configuration Release --no-build -- --rows=100

          $required = @(
            'benchmarks/results/pk-int-lookup.html',
            'benchmarks/results/pk-int-lookup.manifest.json',
            'benchmarks/results/pk-int-lookup.raw.json',
            'benchmarks/results/pk-int-lookup.raw.csv'
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) {
              throw "Benchmark smoke test did not produce $path"
            }
          }

          $manifest = Get-Content 'benchmarks/results/pk-int-lookup.manifest.json' -Raw | ConvertFrom-Json
          if ($manifest.coordinator.buildConfiguration -ne 'Release') {
            throw "Expected Release benchmark manifest, got $($manifest.coordinator.buildConfiguration)"
          }
          if (-not $manifest.coordinator.publicationReady) {
            throw 'Release benchmark manifest is not marked publication-ready.'
          }
          foreach ($worker in $manifest.engineProcesses) {
            if ($worker.buildConfiguration -ne 'Release' -or -not $worker.publicationReady) {
              throw "Worker $($worker.engine) is not an optimized Release worker."
            }
          }

          $raw = Get-Content 'benchmarks/results/pk-int-lookup.raw.json' -Raw | ConvertFrom-Json
          if ($raw.options.samplingModel -ne 'lookup-phase-plans') {
            throw "Unexpected sampling model: $($raw.options.samplingModel)"
          }
          if ($raw.options.PSObject.Properties.Name -contains 'warmupOps') {
            throw 'Lookup raw options still expose misleading warmupOps.'
          }

          foreach ($run in $raw.lookupRuns) {
            foreach ($phase in $run.phases) {
              $plan = $phase.plan
              if ($plan.measuredBatches -le 0 -or $plan.queriesPerBatch -le 1 -or $plan.latencySamples -le 0) {
                throw "Incomplete resolved lookup plan for $($phase.name)."
              }
              if ($plan.batchQueries -ne ($plan.measuredBatches * $plan.queriesPerBatch)) {
                throw "Inconsistent batch query count for $($phase.name)."
              }
              if ($plan.totalMeasuredQueries -ne ($plan.batchQueries + $plan.latencySamples)) {
                throw "Inconsistent total measured query count for $($phase.name)."
              }

              foreach ($engine in $phase.engines) {
                if ([string]$engine.batchRows -ne [string]$phase.expectedBatch.rows -or
                    [string]$engine.batchChecksum -ne [string]$phase.expectedBatch.checksum) {
                  throw "Batch correctness mismatch for $($engine.engine), $($phase.name)."
                }
                if ([string]$engine.latencyRows -ne [string]$phase.expectedLatency.rows -or
                    [string]$engine.latencyChecksum -ne [string]$phase.expectedLatency.checksum) {
                  throw "Latency correctness mismatch for $($engine.engine), $($phase.name)."
                }
              }
            }
          }

          $csv = Import-Csv 'benchmarks/results/pk-int-lookup.raw.csv'
          $batchRows = @($csv | Where-Object { $_.metric -eq 'lookup-batch-average' })
          if ($batchRows.Count -eq 0) {
            throw 'Raw CSV contains no lookup batch samples.'
          }
          $invalidBatchRows = @($batchRows | Where-Object { [int64]$_.batch_size -ne 100 })
          if ($invalidBatchRows.Count -ne 0) {
            throw 'Lookup CSV batch_size does not match the 100-query primary-key plan.'
          }

      - name: Test
        run: >-
          dotnet test "${{ steps.locate_solution.outputs.solution }}"
          --configuration Release
          --no-build
          --verbosity normal

  pack:
    name: Pack NuGet artifacts
    runs-on: ubuntu-latest
    needs: build-test
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x

      - name: Locate solution
        id: locate_solution
        shell: pwsh
        run: |
          $solution = Get-ChildItem -Path $env:GITHUB_WORKSPACE -File -Recurse |
            Where-Object { $_.Extension -in '.sln', '.slnx' } |
            Sort-Object FullName |
            Select-Object -First 1 -ExpandProperty FullName

          if (-not $solution) {
            throw 'No .sln or .slnx file was found in the repository.'
          }

          "solution=$solution" >> $env:GITHUB_OUTPUT
          Write-Host "Using solution: $solution"

      - name: Restore
        run: dotnet restore "${{ steps.locate_solution.outputs.solution }}"

      - name: Build Polar.DB for every target framework
        run: >-
          dotnet build src/Polar.DB/Polar.DB.csproj
          --configuration Release
          --no-restore
          /p:ContinuousIntegrationBuild=true
          /p:GeneratePackageOnBuild=false

      - name: Build package projects
        run: >-
          dotnet build src/Polar.DB.Typed/Polar.DB.Typed.csproj
          --configuration Release
          --no-restore
          /p:ContinuousIntegrationBuild=true
          /p:GeneratePackageOnBuild=false

      - name: Pack Polar.DB
        run: >-
          dotnet pack src/Polar.DB/Polar.DB.csproj
          --configuration Release
          --no-build
          --output "${{ github.workspace }}/artifacts/nuget"
          /p:ContinuousIntegrationBuild=true

      - name: Pack Polar.DB.Typed
        run: >-
          dotnet pack src/Polar.DB.Typed/Polar.DB.Typed.csproj
          --configuration Release
          --no-build
          --output "${{ github.workspace }}/artifacts/nuget"
          /p:ContinuousIntegrationBuild=true

      - name: Validate package contents
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression
          $dir = Join-Path $env:GITHUB_WORKSPACE 'artifacts/nuget'
          foreach ($id in @('Polar.DB', 'Polar.DB.Typed')) {
            $package = Get-ChildItem -Path $dir -Filter "$id.*.nupkg" |
              Where-Object { $_.Name -match ('^' + [regex]::Escape($id) + '\.\d') } |
              Select-Object -First 1
            if (-not $package) { throw "Missing NuGet package: $id" }
            $archive = [System.IO.Compression.ZipFile]::OpenRead($package.FullName)
            try {
              $entry = $archive.Entries | Where-Object {
                $_.FullName -match ('^lib/.*/' + [regex]::Escape($id) + '\.dll$')
              }
              if (-not $entry) { throw "Package $($package.Name) has no library DLL" }
              Write-Host "$($package.Name): $($entry.Count) library entry(ies)"
            } finally { $archive.Dispose() }
          }

      - name: Upload NuGet artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            ${{ github.workspace }}/artifacts/nuget/*.nupkg
            ${{ github.workspace }}/artifacts/nuget/*.snupkg
          if-no-files-found: error
