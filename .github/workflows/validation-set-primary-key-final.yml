name: Validation SetPrimaryKey final

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Audit migration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('.')
          cs_files = sorted(p for p in root.rglob('*.cs') if '.git' not in p.parts)
          text_files = sorted(
              p for pattern in ('*.cs', '*.csproj', '*.props')
              for p in root.rglob(pattern)
              if '.git' not in p.parts
          )

          old_symbols = (
              'OpenWithSetPrimaryKey',
              'parallelOriginalOffsets',
              'PrimaryKeyDefinitionExperiment',
              'TypedPrimaryBuildExperiment',
          )

          def parse_argument_count(text: str, open_paren: int):
              depth = 0
              commas = 0
              has_content = False
              quote = None
              escape = False
              index = open_paren + 1

              while index < len(text):
                  ch = text[index]

                  if quote is not None:
                      if escape:
                          escape = False
                      elif ch == '\\' and quote != "'":
                          escape = True
                      elif ch == quote:
                          quote = None
                      index += 1
                      continue

                  if ch in ('"', "'"):
                      quote = ch
                      has_content = True
                  elif ch in '([{':
                      depth += 1
                      has_content = True
                  elif ch in ']}':
                      depth -= 1
                  elif ch == ')':
                      if depth == 0:
                          return (0 if not has_content else commas + 1), index
                      depth -= 1
                  elif ch == ',' and depth == 0:
                      commas += 1
                  elif not ch.isspace():
                      has_content = True

                  index += 1

              raise ValueError('Unclosed USequence constructor call')

          construction_sites = []
          legacy_sites = []
          set_primary_sites = []
          symbol_hits = []

          for path in cs_files:
              text = path.read_text(encoding='utf-8', errors='replace')
              lines = text.splitlines()
              search_from = 0

              while True:
                  start = text.find('new USequence', search_from)
                  if start < 0:
                      break

                  line_start = text.rfind('\n', 0, start) + 1
                  prefix = text[line_start:start]
                  search_from = start + len('new USequence')
                  if '//' in prefix:
                      continue

                  open_paren = text.find('(', start)
                  if open_paren < 0:
                      continue

                  arg_count, end = parse_argument_count(text, open_paren)
                  line_number = text.count('\n', 0, start) + 1
                  line_index = line_number - 1
                  block = '\n'.join(lines[line_index:min(len(lines), line_index + 16)])
                  normalized = path.as_posix().lstrip('./')
                  construction_sites.append((normalized, line_number, arg_count, block))

                  if arg_count >= 6 and not normalized.startswith('mag_series/'):
                      if normalized != 'tests/Polar.DB.Tests/USequencePrimaryKeyConfigurationTests.cs':
                          legacy_sites.append((normalized, line_number, arg_count))

                  search_from = end + 1

              for index, line in enumerate(lines):
                  if 'SetPrimaryKey' in line:
                      set_primary_sites.append((path.as_posix().lstrip('./'), index + 1, line.strip()))

          for path in text_files:
              normalized = path.as_posix().lstrip('./')
              for index, line in enumerate(path.read_text(encoding='utf-8', errors='replace').splitlines()):
                  if any(symbol in line for symbol in old_symbols):
                      symbol_hits.append((normalized, index + 1, line.strip()))

          with Path('migration-audit.txt').open('w', encoding='utf-8') as out:
              out.write(f'construction_sites={len(construction_sites)}\n')
              out.write(f'set_primary_sites={len(set_primary_sites)}\n')
              out.write(f'unexpected_legacy_sites={len(legacy_sites)}\n')
              out.write(f'old_symbol_hits={len(symbol_hits)}\n')
              out.write('\n=== UNEXPECTED LEGACY SITES ===\n')
              for path, line, arg_count in legacy_sites:
                  out.write(f'{path}:{line}: args={arg_count}\n')
              out.write('\n=== OLD SYMBOL HITS ===\n')
              for path, line, value in symbol_hits:
                  out.write(f'{path}:{line}: {value}\n')
              out.write('\n=== ALL CONSTRUCTION SITES ===\n')
              for path, line, arg_count, block in construction_sites:
                  out.write(f'\n--- {path}:{line} args={arg_count} ---\n{block}\n')
              out.write('\n=== SET PRIMARY KEY SITES ===\n')
              for path, line, value in set_primary_sites:
                  out.write(f'{path}:{line}: {value}\n')

          with Path('audit-status.txt').open('w', encoding='utf-8') as out:
              out.write(f'unexpected_legacy_sites={len(legacy_sites)}\n')
              out.write(f'old_symbol_hits={len(symbol_hits)}\n')
          PY
      - name: Restore
        run: dotnet restore Polar.DB.slnx
      - name: Build and test
        shell: bash
        run: |
          set +e
          dotnet build Polar.DB.slnx --configuration Release --no-restore /p:ContinuousIntegrationBuild=true --verbosity minimal > build.log 2>&1
          build_code=$?

          if [ "$build_code" -eq 0 ]; then
            dotnet test Polar.DB.slnx --configuration Release --no-build --verbosity normal > test.log 2>&1
            test_code=$?
          else
            printf 'Tests skipped because build failed.\n' > test.log
            test_code=125
          fi

          {
            cat audit-status.txt
            echo "build_exit_code=$build_code"
            echo "test_exit_code=$test_code"
            echo "--- build errors ---"
            grep -E "error [A-Z]+[0-9]+|Build FAILED|Build succeeded" build.log || true
            echo "--- test summary ---"
            grep -E "Failed!|Passed!|Total tests:|Failed:|Passed:|Skipped:" test.log || true
          } > validation-summary.txt

          exit 0
      - name: Upload validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: set-primary-key-final-validation
          path: |
            migration-audit.txt
            audit-status.txt
            validation-summary.txt
            build.log
            test.log
          if-no-files-found: error
