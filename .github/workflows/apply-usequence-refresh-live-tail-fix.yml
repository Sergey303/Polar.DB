name: Apply USequence Refresh live-tail fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/usequence-refresh-live-tail'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/usequence-refresh-live-tail
          fetch-depth: 0
      - name: Flush live sequence before Refresh
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/Polar.DB/USequence.cs')
          raw = path.read_bytes()
          bom = raw.startswith(b'\xef\xbb\xbf')
          text = raw.decode('utf-8-sig')

          old = '''        public void Refresh()
                  {
                      RefreshCore(persistRecoveredIndexes: false);
                  }'''
          new = '''        public void Refresh()
                  {
                      sequence.Flush();
                      RefreshCore(persistRecoveredIndexes: false);
                  }'''

          if new not in text:
              if text.count(old) != 1:
                  raise RuntimeError(f'Expected exactly one Refresh block, found {text.count(old)}.')
              text = text.replace(old, new)
              path.write_bytes((b'\xef\xbb\xbf' if bom else b'') + text.encode('utf-8'))
      - name: Commit Refresh fix
        shell: bash
        run: |
          if git diff --quiet -- src/Polar.DB/USequence.cs; then
            echo 'No production diff to commit.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/Polar.DB/USequence.cs
          git commit -m 'Preserve live append tail across USequence Refresh'
          git push origin HEAD:fix/usequence-refresh-live-tail
