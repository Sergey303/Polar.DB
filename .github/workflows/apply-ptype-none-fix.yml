name: Apply PType none fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/ptype-none-interpret'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ptype-none-interpret
          fetch-depth: 0
      - name: Patch PType none interpretation
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/Polar.DB/Types.cs')
          raw = path.read_bytes()
          bom = raw.startswith(b'\xef\xbb\xbf')
          text = raw.decode('utf-8-sig')

          old = '            if (v == null) throw new ArgumentNullException();'
          new = '            if (v == null && this.vid != PTypeEnumeration.none) throw new ArgumentNullException();'

          if new in text:
              print('PType none fix is already applied.')
          else:
              if text.count(old) != 1:
                  raise RuntimeError(f'Expected exactly one old null guard, found {text.count(old)}.')
              text = text.replace(old, new)
              path.write_bytes((b'\xef\xbb\xbf' if bom else b'') + text.encode('utf-8'))
      - name: Commit exact one-line fix
        shell: bash
        run: |
          if git diff --quiet -- src/Polar.DB/Types.cs; then
            echo 'No production diff to commit.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/Polar.DB/Types.cs
          git commit -m 'Allow null payload for PType none'
          git push origin HEAD:fix/ptype-none-interpret
