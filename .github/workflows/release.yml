name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-pack-release:
    name: Build, pack, and publish
    runs-on: ubuntu-latest
    env:
      NUGET_API_KEYS: ${{ secrets.NUGET_API_KEYS }}
      NUGET_SOURCE: https://api.nuget.org/v3/index.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x

      - name: Locate solution
        id: locate_solution
        shell: pwsh
        run: |
          $solution = Get-ChildItem -Path $env:GITHUB_WORKSPACE -File -Recurse |
            Where-Object { $_.Extension -in '.sln', '.slnx' } |
            Sort-Object FullName |
            Select-Object -First 1 -ExpandProperty FullName

          if (-not $solution) {
            throw 'No .sln or .slnx file was found in the repository.'
          }

          "solution=$solution" >> $env:GITHUB_OUTPUT
          Write-Host "Using solution: $solution"

      - name: Locate package projects
        id: locate_pack_projects
        shell: pwsh
        run: |
          $baseProject = Join-Path $env:GITHUB_WORKSPACE 'src/Polar.DB/Polar.DB.csproj'
          $typedProject = Join-Path $env:GITHUB_WORKSPACE 'src/Polar.DB.Typed/Polar.DB.Typed.csproj'

          foreach ($project in @($baseProject, $typedProject)) {
            if (-not (Test-Path $project)) {
              throw "Pack project was not found: $project"
            }
          }

          "base_project=$baseProject" >> $env:GITHUB_OUTPUT
          "typed_project=$typedProject" >> $env:GITHUB_OUTPUT
          Write-Host "Using base pack project: $baseProject"
          Write-Host "Using typed pack project: $typedProject"

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Using version: $VERSION"

      - name: Restore
        run: dotnet restore "${{ steps.locate_solution.outputs.solution }}"

      - name: Build complete solution
        run: >-
          dotnet build "${{ steps.locate_solution.outputs.solution }}"
          --configuration Release
          --no-restore
          /p:ContinuousIntegrationBuild=true
          /p:Version=${{ steps.version.outputs.version }}

      - name: Build typed API with warnings as errors
        run: >-
          dotnet build "${{ steps.locate_pack_projects.outputs.typed_project }}"
          --configuration Release
          --no-restore
          --no-dependencies
          --no-incremental
          /p:ContinuousIntegrationBuild=true
          /p:Version=${{ steps.version.outputs.version }}
          /warnaserror

      - name: Test
        run: >-
          dotnet test "${{ steps.locate_solution.outputs.solution }}"
          --configuration Release
          --no-build
          --verbosity normal

      - name: Pack Polar.DB
        run: >-
          dotnet pack "${{ steps.locate_pack_projects.outputs.base_project }}"
          --configuration Release
          --no-build
          --output "${{ github.workspace }}/artifacts/nuget"
          /p:ContinuousIntegrationBuild=true
          /p:Version=${{ steps.version.outputs.version }}

      - name: Pack Polar.DB.Typed
        run: >-
          dotnet pack "${{ steps.locate_pack_projects.outputs.typed_project }}"
          --configuration Release
          --no-build
          --output "${{ github.workspace }}/artifacts/nuget"
          /p:ContinuousIntegrationBuild=true
          /p:Version=${{ steps.version.outputs.version }}

      - name: Verify package set
        shell: bash
        run: |
          version='${{ steps.version.outputs.version }}'
          base_package="${GITHUB_WORKSPACE}/artifacts/nuget/Polar.DB.${version}.nupkg"
          typed_package="${GITHUB_WORKSPACE}/artifacts/nuget/Polar.DB.Typed.${version}.nupkg"

          for package in "$base_package" "$typed_package"; do
            if [[ ! -f "$package" ]]; then
              echo "Expected package was not produced: $package"
              find "${GITHUB_WORKSPACE}/artifacts/nuget" -maxdepth 1 -type f -print || true
              exit 1
            fi
          done

      - name: Upload build artifacts for manual or non-tag runs
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages-${{ steps.version.outputs.version }}
          path: |
            ${{ github.workspace }}/artifacts/nuget/Polar.DB*.nupkg
            ${{ github.workspace }}/artifacts/nuget/Polar.DB*.snupkg
          if-no-files-found: error

      - name: Normalize NuGet API key
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          raw="${NUGET_API_KEYS-}"

          if [[ -z "$raw" ]]; then
            echo "NUGET_API_KEYS is not configured."
            exit 1
          fi

          echo "::add-mask::$raw"

          sanitized="$(printf '%s' "$raw" | tr -d '\r\n')"
          sanitized="$(printf '%s' "$sanitized" | sed -E 's/^[[:space:]]*key[[:space:]]*[:=][[:space:]]*//I')"
          sanitized="$(printf '%s' "$sanitized" | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//')"

          if [[ -z "$sanitized" ]]; then
            echo "Normalized NuGet API key is empty."
            exit 1
          fi

          echo "::add-mask::$sanitized"

          {
            echo "NUGET_API_KEY_NORMALIZED<<EOF"
            printf '%s\n' "$sanitized"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Publish packages to NuGet.org
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version='${{ steps.version.outputs.version }}'
          packages=(
            "${GITHUB_WORKSPACE}/artifacts/nuget/Polar.DB.${version}.nupkg"
            "${GITHUB_WORKSPACE}/artifacts/nuget/Polar.DB.Typed.${version}.nupkg"
          )

          for package in "${packages[@]}"; do
            dotnet nuget push "$package" \
              --api-key "$NUGET_API_KEY_NORMALIZED" \
              --source "$NUGET_SOURCE" \
              --skip-duplicate
          done

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ${{ github.workspace }}/artifacts/nuget/Polar.DB*.nupkg
            ${{ github.workspace }}/artifacts/nuget/Polar.DB*.snupkg
